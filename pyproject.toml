[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction"
version = "0.1.0"
description = "Measuring abstract and concrete language in literary history"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
llm = ["litellm", "hashstash[rec]"]
viz = ["playwright", "nest_asyncio"]
analysis = ["scikit-learn", "umap-learn"]
all = ["litellm", "hashstash[rec]", "playwright", "nest_asyncio", "scikit-learn", "umap-learn", "tabula-py"]

[project.scripts]
abstraction = "abstraction.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction*"]
